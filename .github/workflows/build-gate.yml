# build-gate — MI Apps pre-merge build check.
# Fails a commit/PR (red X) if the app doesn't install + build cleanly, so broken code
# can't sit on master unbuilt. Catches pnpm-lock.yaml drift (--frozen-lockfile) + tsc/vite errors.
name: build-gate
on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]
jobs:
  build-gate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # Node 24 (matches .nvmrc): pnpm v11 requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # corepack ships with Node; it activates the exact pnpm pinned in package.json "packageManager".
      - name: Enable corepack (activates pinned pnpm)
        run: corepack enable
      - name: Install (frozen lockfile — the pnpm equivalent of `npm ci`; fails on lock drift)
        run: pnpm install --frozen-lockfile
      - name: Build (fails on tsc/vite errors)
        run: pnpm run build
      - name: Lint (Biome — warn-only during rollout)
        continue-on-error: true
        run: pnpm run lint
